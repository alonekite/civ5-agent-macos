name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "setuptools>=68"
      - run: python -m pip install -e .
      - run: python -Wd -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - run: mkdir -p dist-repeat
      - run: python -m pip wheel --no-deps --wheel-dir dist-repeat .
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist-repeat')"
      - run: python scripts/check_release_artifact.py dist/*.whl dist-repeat/*.whl
      - run: python scripts/check_release_artifact.py dist/*.tar.gz dist-repeat/*.tar.gz
      - run: python -m venv /tmp/civ5-agent-release-venv
      - run: /tmp/civ5-agent-release-venv/bin/pip install --no-deps --no-index dist/*.whl
      - run: /tmp/civ5-agent-release-venv/bin/python -c "import civ5_agent.api"
      - run: /tmp/civ5-agent-release-venv/bin/civ5-turn --help
      - run: python -m venv /tmp/civ5-agent-sdist-venv
      - run: /tmp/civ5-agent-sdist-venv/bin/pip install --no-deps dist/*.tar.gz
      - run: /tmp/civ5-agent-sdist-venv/bin/python -c "import civ5_agent.api"
