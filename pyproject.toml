[project]
name = "civ5-agent-macos"
version = "1.2.0"
description = "Verified Civilization V read/write core for Apple Silicon macOS"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/alonekite/civ5-agent-macos"

[project.scripts]
civ5-watch = "civ5_agent.watch:main"
civ5-command = "civ5_agent.command:main"
civ5-controller = "civ5_agent.controller:main"
civ5-preflight = "civ5_agent.preflight:main"
civ5-live-session = "civ5_agent.live_session:main"
civ5-knowledge = "civ5_agent.knowledge.import_sqlite:main"
civ5-journal = "civ5_agent.journal_cli:main"
civ5-turn = "civ5_agent.turn_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
