[project]
name = "civ5-agent-macos"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
civ5-watch = "civ5_agent.watch:main"
civ5-command = "civ5_agent.command:main"
civ5-controller = "civ5_agent.controller:main"
civ5-preflight = "civ5_agent.preflight:main"
civ5-live-session = "civ5_agent.live_session:main"
civ5-knowledge = "civ5_agent.knowledge.import_sqlite:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
